# TechnoSoft Bonus 1.0 — внешняя конфигурация сервера.
#
# Файл читается при запуске (start.sh / start.bat передают его в параметре
# --spring.config.additional-location) и дополняет настройки, встроенные в app/technosoft-bonus.jar:
# здесь указано только то, что зависит от места установки. Пересборка не нужна — достаточно
# изменить файл или переменные окружения и перезапустить сервер.
#
# Запись ${ИМЯ:значение} означает: взять переменную окружения ИМЯ, а если она не задана —
# значение после двоеточия. Переменные удобно задавать в начале start.sh / start.bat.

spring:
  datasource:
    # База данных PostgreSQL 14 или новее, восстановленная скриптом restore-db.sh / restore-db.bat.
    url: jdbc:postgresql://${BONUS_DB_HOST:localhost}:${BONUS_DB_PORT:5432}/${BONUS_DB_NAME:technosoft_bonus}
    username: ${BONUS_DB_USER:postgres}
    password: ${BONUS_DB_PASSWORD:}
    hikari:
      # Соединений с БД на один экземпляр сервера. Должно быть БОЛЬШЕ, чем BONUS_HTTP_THREADS + 2:
      # операция начисления/списания держит одно соединение и после фиксации берёт второе для уведомления
      # получателя; при пуле не больше числа одновременных запросов они ждут друг друга (проверено замером:
      # 20 одновременных массовых начислений при пуле 10 — отказы через 30 с). Два экземпляра по 45 соединений
      # укладываются в стандартный предел PostgreSQL max_connections = 100.
      maximum-pool-size: ${BONUS_DB_POOL_SIZE:45}

  # Клиент (веб-интерфейс) встроен в архив сервера. Чтобы раздавать его из внешней папки
  # (например, после обновления клиента без пересборки сервера), раскомментируйте:
  # web:
  #   resources:
  #     static-locations: file:./web/

server:
  port: ${BONUS_PORT:8080}            # порт веб-интерфейса и REST API (http://<сервер>:<порт>)
  tomcat:
    threads:
      max: ${BONUS_HTTP_THREADS:40}   # одновременно обрабатываемых запросов; остальные ждут в очереди соединений

bonus:
  accrual-limit: ${BONUS_ACCRUAL_LIMIT:1000}   # лимит разового ручного начисления, баллы (выше — на согласование)
  zone: ${BONUS_ZONE:Europe/Minsk}             # часовой пояс бизнес-дат
  event-scheduler:
    # Автоматическая обработка очереди событий от внешних систем (начисление по KPI-событиям).
    enabled: ${BONUS_EVENT_SCHEDULER_ENABLED:true}
    delay: ${BONUS_EVENT_SCHEDULER_DELAY:PT1M}  # пауза между проходами (ISO 8601: PT1M — 1 минута)
  security:
    jwt:
      # Секрет подписи токенов входа — ОБЯЗАТЕЛЬНАЯ переменная, не короче 32 символов.
      # Значения по умолчанию нет: без переменной сервер не запустится.
      secret: ${BONUS_JWT_SECRET}
      ttl: ${BONUS_JWT_TTL:PT8H}               # срок действия входа (рабочая смена)
    # Ключ шифрования API-ключей интеграций (AES-256) — ОБЯЗАТЕЛЬНАЯ переменная: 32 байта в base64
    # (44 символа). После первого запуска не меняйте: ранее сохранённые ключи интеграций не расшифруются.
    secret-key: ${BONUS_SECRET_KEY}
    initial-password: ${BONUS_INITIAL_PASSWORD:demo}   # временный пароль новых учётных записей
    # Адреса, с которых браузеру разрешены запросы к API с другого источника. Веб-интерфейс раздаётся
    # этим же сервером, поэтому для обычной работы список можно не менять.
    cors-origins: ${BONUS_CORS_ORIGINS:http://localhost:5173}

logging:
  file:
    name: ${BONUS_LOG_FILE:logs/technosoft-bonus.log}   # журнал сервера (кроме вывода в консоль)
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
